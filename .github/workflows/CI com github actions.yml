name: teste CI - Cypress - github acitons

on:
  push:
    branches: [ "main" ]


jobs:
  build:

    runs-on: ubuntu-latest

    

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: 19
        cache: 'npm'
    - name: Intalar Dependencias
      run: npm install

    - name: Executar testes
      run:  npm test
   
